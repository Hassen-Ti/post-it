[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# Règles listées explicitement : les défauts de ruff changent d'une version à l'autre.
# E4/E7/E9/F = erreurs de syntaxe, imports inutilisés, variables non définies ou inutilisées.
select = ["E4", "E7", "E9", "F"]
# E741 : `l` pour « ligne » est l'usage du projet.
ignore = ["E741"]
