# Evals de comportement : Claude répond vraiment aux cas de evals/, avec et sans Post-it.
# Lancement manuel uniquement (onglet Actions → Evals → Run workflow) : ça consomme des crédits API.
# Pré-requis : un secret de dépôt ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).
name: Evals

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de cas à lancer (vide = tous). Ex. : stress, fonctionnel, cowork"
        required: false
        default: ""
      runs:
        description: "Essais par cas"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt  # le scaffold du cas Cowork génère des PDF et des Excel
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAG: ${{ inputs.tag }}
          RUNS: ${{ inputs.runs }}
        run: |
          claude plugin eval . --trust-plugin --scaffold --allow-tools Bash Write Edit \
            --runs "$RUNS" --no-publish --report evals/results/report.html --json evals/results/result.json \
            ${TAG:+--tag "$TAG"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-report
          path: evals/results/
